<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household Finance — money-math tests</title>
  <style>
    body { font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 24px auto; max-width: 720px; padding: 0 16px; }
    h1 { font-size: 1.2rem; }
    .pass { color: #1E7B44; }
    .fail { color: #C0392B; font-weight: 700; }
    #summary { font-weight: 800; margin: 12px 0; }
    li { margin: 3px 0; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Money-math tests</h1>
  <p>Assertions against the live data layer (uses an isolated in-memory copy — your real data is untouched). Open this file next to <code>index.html</code>.</p>
  <div id="summary">running…</div>
  <ul id="out"></ul>

  <!-- Isolate: stash real data, run against a fresh demo seed, restore afterwards. -->
  <script>
    window.__realData = localStorage.getItem('householdFinance.v1');
    localStorage.removeItem('householdFinance.v1');
  </script>
  <script src="js/store/00-state.js"></script>
  <script src="js/store/01-format.js"></script>
  <script src="js/store/02-members.js"></script>
  <script src="js/store/03-budget.js"></script>
  <script src="js/store/04-paycycles.js"></script>
  <script src="js/store/05-transactions.js"></script>
  <script src="js/store/06-calendar.js"></script>
  <script src="js/store/07-networth.js"></script>
  <script src="js/store/99-export.js"></script>
  <script>
    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    const t = (name, cond, detail) => {
      const li = document.createElement('li');
      li.className = cond ? 'pass' : 'fail';
      li.textContent = (cond ? '✓ ' : '✗ ') + name + (cond ? '' : ' — ' + (detail || ''));
      out.appendChild(li);
      cond ? pass++ : fail++;
    };
    const S = Store;
    const near = (a, b, eps) => Math.abs(a - b) <= (eps == null ? 0.01 : eps);

    try {
    /* formatting — js/store/01-format.js is byte-identical with the sibling
       repo (roadmap F-I3); these assertions run in both, so a behavioral
       regression in the shared money-math is caught even where the sync-drift
       gate's textual diff can't see one (or where two repos' copies could
       silently diverge in behavior without a textual difference to flag). */
    t('fmt$ rounds and signs', S.fmt$(-1234.5, 0) === '−$1,235' && S.fmt$(12.345, 2) === '$12.35', S.fmt$(-1234.5, 0));
    t('fmt$ defaults to 2 decimals under 1000, 0 at/above', S.fmt$(999) === '$999.00' && S.fmt$(1000) === '$1,000', S.fmt$(999) + ' / ' + S.fmt$(1000));
    t('fmt$ treats null/NaN as em dash', S.fmt$(null) === '—' && S.fmt$(NaN) === '—', S.fmt$(null));
    t('fmtPct defaults to 1 decimal, honors an override', S.fmtPct(0.5) === '50.0%' && S.fmtPct(0.256, 0) === '26%', S.fmtPct(0.5));
    t('fmtPct treats null/NaN as em dash', S.fmtPct(null) === '—' && S.fmtPct(NaN) === '—', S.fmtPct(null));
    t('fmtDate spells the month, no leading zero on the day', S.fmtDate('2026-01-09') === 'Jan 9, 2026', S.fmtDate('2026-01-09'));
    t('fmtDate treats a falsy iso as em dash', S.fmtDate('') === '—' && S.fmtDate(null) === '—', S.fmtDate(''));
    t('fmtMonth spells the month, no day', S.fmtMonth('2026-07') === 'Jul 2026', S.fmtMonth('2026-07'));
    t('isoFromUs parses 2-digit years', S.isoFromUs('7/3/26') === '2026-07-03', S.isoFromUs('7/3/26'));
    t('isoFromUs parses 4-digit years and pads single digits', S.isoFromUs('1/2/2026') === '2026-01-02', S.isoFromUs('1/2/2026'));
    t('isoFromUs rejects unparseable input', S.isoFromUs('not a date') === null, S.isoFromUs('not a date'));
    t('usDate round-trips', S.usDate('2026-07-03') === '07/03/2026', S.usDate('2026-07-03'));
    t('thisMonth is a YYYY-MM string', /^\d{4}-\d{2}$/.test(S.thisMonth()), S.thisMonth());
    /* addMonths — pins the bug this file's own monthsAgoYm() helper hit on
       2026-08-31: naive d.setMonth(d.getMonth() - 2) rolled June 30 (2026's
       actual "2 months before Aug 31") forward into July 1, because June
       only has 30 days and JS spills the extra day into the next month. */
    const ymd = d => d.toISOString().slice(0, 10);
    t('addMonths clamps into a shorter month (non-leap Feb)', ymd(S.addMonths(new Date(2026, 0, 31), 1)) === '2026-02-28', ymd(S.addMonths(new Date(2026, 0, 31), 1)));
    t('addMonths clamps into a shorter month (leap Feb)', ymd(S.addMonths(new Date(2024, 0, 31), 1)) === '2024-02-29', ymd(S.addMonths(new Date(2024, 0, 31), 1)));
    t('addMonths subtracts across a shorter month without overflow', ymd(S.addMonths(new Date(2026, 7, 31), -2)) === '2026-06-30', ymd(S.addMonths(new Date(2026, 7, 31), -2)));
    t('addMonths crosses a year boundary', ymd(S.addMonths(new Date(2026, 11, 15), 2)) === '2027-02-15', ymd(S.addMonths(new Date(2026, 11, 15), 2)));
    t('addMonths leaves a mid-month day untouched', ymd(S.addMonths(new Date(2026, 5, 15), 3)) === '2026-09-15', ymd(S.addMonths(new Date(2026, 5, 15), 3)));

    /* budget & derived */
    t('budgetTotal = sum of lines', near(S.budgetTotal(), S.data.budget.reduce((s, b) => s + b.monthly, 0)));
    t('surplus = income − budget', near(S.surplus(), S.incomeTotal() - S.budgetTotal()));
    // Unlike the fixed two-person model, budgetByPerson() here returns a
    // roster-shaped `attributed` map — every member's share plus their own
    // lines should still add back up to the whole budget, regardless of
    // how many people are in the household.
    const p = S.budgetByPerson();
    t('shared split balances across the roster',
      near(Object.values(p.attributed).reduce((s, v) => s + v, 0), S.budgetTotal()), JSON.stringify(p));

    /* goals */
    const g = { target: 1000, saved: 250, monthly: 250 };
    const gm = S.goalMeta(g);
    t('goalMeta months = ceil(remaining/monthly)', gm.months === 3 && near(gm.pct, 0.25), JSON.stringify(gm));

    /* Roth goal <-> Investments reconciliation: a goal's `saved` is a live
       pass-through to data.invest.roth[rothPerson], not an independent
       stored figure, so the two screens can no longer drift apart. Ported
       from Cross-Household- (fixed Mike/Bri pair there); here rothPerson
       is a member name since this repo's roster is dynamic, so rename/
       remove also need covering. */
    const alexRothGoal = S.data.goals.find(x => x.rothPerson === 'Alex');
    const samRothGoal = S.data.goals.find(x => x.rothPerson === 'Sam');
    t('seeded Roth goals are tagged with rothPerson', !!alexRothGoal && !!samRothGoal,
      JSON.stringify({ alex: !!alexRothGoal, sam: !!samRothGoal }));
    if (alexRothGoal) {
      t('Roth goal.saved reads live from data.invest.roth[person]',
        near(alexRothGoal.saved, S.rothMeta('Alex').ytd), JSON.stringify({ goalSaved: alexRothGoal.saved, ytd: S.rothMeta('Alex').ytd }));
      S.data.invest.roth.Alex = 3000;
      t('changing data.invest.roth.Alex is reflected in the goal (Investments -> Goals)',
        near(alexRothGoal.saved, 3000), alexRothGoal.saved);
      alexRothGoal.saved = 4500;
      t('setting the goal\'s saved writes through to data.invest.roth (Goals -> Investments)',
        near(S.data.invest.roth.Alex, 4500), S.data.invest.roth.Alex);
      t('goalMeta on a Roth goal reflects the live-linked saved figure',
        near(S.goalMeta(alexRothGoal).pct, 4500 / alexRothGoal.target, 0.001), JSON.stringify(S.goalMeta(alexRothGoal)));
    }
    t('a plain (non-Roth) goal keeps its own independent saved field, unaffected',
      (() => { g.saved = 999; return g.saved === 999 && S.data.invest.roth.Alex !== 999; })());

    /* Roth linkage follows a rename, and survives a removal by unlinking
       into a plain figure instead of silently reading 0. Uses a scratch
       member (not Alex/Sam) so it doesn't disturb the rest of the suite,
       which assumes the seeded two-person roster. */
    S.addMember('RothTestPerson');
    const scratchGoal = { id: S.uid(), name: 'Roth IRA — RothTestPerson (test)', target: 5000, saved: 0, monthly: 100, rothPerson: 'RothTestPerson' };
    S.data.goals.push(scratchGoal);
    wireRothGoalLinks(S.data); // the real function (bare global, same top-level scope as tests.html itself), not a hand-rolled copy
    scratchGoal.saved = 750;
    S.renameMember('RothTestPerson', 'RothTestRenamed');
    t('renameMember moves a linked goal\'s rothPerson tag with it',
      scratchGoal.rothPerson === 'RothTestRenamed', scratchGoal.rothPerson);
    t('the renamed goal still reads the same live balance after the rename',
      near(scratchGoal.saved, 750), scratchGoal.saved);
    S.removeMember('RothTestRenamed');
    t('removeMember unlinks the goal instead of leaving it reading a deleted key',
      !scratchGoal.rothPerson && near(scratchGoal.saved, 750), JSON.stringify({ rothPerson: scratchGoal.rothPerson, saved: scratchGoal.saved }));
    scratchGoal.saved = 900;
    t('once unlinked, saved is a plain field again (no roth key resurrected)',
      scratchGoal.saved === 900 && !('RothTestRenamed' in S.data.invest.roth), JSON.stringify(S.data.invest.roth));
    S.data.goals = S.data.goals.filter(x => x.id !== scratchGoal.id); // scratch cleanup

    /* house scenario */
    const hs = S.houseScenario({ price: 300000, downPct: 10 });
    t('house P&I ≈ amortization formula', near(hs.pi, 270000 * (0.065 / 12) / (1 - Math.pow(1 + 0.065 / 12, -360)), 0.5), hs.pi.toFixed(2));
    t('PMI applies under 20% down', hs.pmi > 0);
    t('no PMI at 20% down', S.houseScenario({ price: 300000, downPct: 20 }).pmi === 0);

    /* merchant intelligence */
    t('normalizeMerchant strips junk', S.normalizeMerchant('GIANT #6482 POS 07/03') === 'GIANT', S.normalizeMerchant('GIANT #6482 POS 07/03'));
    S.data.rules = [];
    S.learnRule('GIANT #1 ALLENTOWN PA', 'Groceries', 'Shared');
    t('rule matches across cities', !!S.ruleFor('GIANT #2 BETHLEHEM PA'));
    t('no false rule match', !S.ruleFor('WAWA 100 EASTON PA'));

    /* visual rule builder — previewRule() + optional tag (Roadmap Phase 1 #4) */
    (function () {
      const iso = d => d.toISOString().slice(0, 10);
      const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
      S.data.transactions.push(
        { id: S.uid(), date: daysAgo(10), category: 'Shopping', description: 'TESTMART 123 ALLENTOWN', amount: 25, who: 'Shared', account: '', notes: '' },
        { id: S.uid(), date: daysAgo(120), category: 'Shopping', description: 'TESTMART 456 BETHLEHEM', amount: 30, who: 'Shared', account: '', notes: '' }
      );
      const preview = S.previewRule({ match: 'TESTMART' });
      t('previewRule matches within the last 90 days', preview.length === 1 && preview[0].description.includes('ALLENTOWN'),
        JSON.stringify(preview));
      t('previewRule ignores matches older than 90 days', !preview.some(p => p.description.includes('BETHLEHEM')));
      t('previewRule returns nothing for an empty match', S.previewRule({ match: '' }).length === 0);

      const rule = S.learnRule('TESTMART 123 ALLENTOWN', 'Shopping', 'Alex', 'test-tag');
      t('learnRule accepts an optional tag', !!rule && rule.tag === 'test-tag', JSON.stringify(rule));
      S.learnRule('TESTMART 123 ALLENTOWN', 'Shopping', 'Alex');
      t('re-learning without a tag argument leaves the existing tag untouched',
        S.ruleFor('TESTMART 123 ALLENTOWN').tag === 'test-tag');
    })();

    /* empty-state "promote to rule" suggestions */
    (function () {
      S.data.transactions.push(
        { id: S.uid(), date: '2026-08-01', category: 'Dining Out', description: 'REPEATEATS DOWNTOWN', amount: 12, who: 'Shared', account: '', notes: '' },
        { id: S.uid(), date: '2026-08-08', category: 'Dining Out', description: 'REPEATEATS DOWNTOWN', amount: 14, who: 'Shared', account: '', notes: '' }
      );
      const suggestions = S.suggestedRuleMerchants(5);
      t('suggestedRuleMerchants surfaces a merchant seen 2+ times with no rule yet',
        suggestions.some(s => s.merchant.toUpperCase().includes('REPEATEATS') && s.category === 'Dining Out'),
        JSON.stringify(suggestions));
    })();

    /* split transactions (Roadmap Phase 1 #4) */
    (function () {
      const tx = { id: S.uid(), date: '2026-08-15', category: 'Shopping', description: 'TARGET SPLIT TEST', amount: 86.40, who: 'Shared', account: '', notes: '' };
      S.data.transactions.push(tx);
      t('applySplit rejects parts that don\'t sum to the transaction total',
        S.applySplit(tx.id, [{ category: 'Groceries', amount: 40 }, { category: 'Shopping', amount: 40 }]) === null);
      t('transaction is untouched after a rejected split', tx.amount === 86.40 && tx.category === 'Shopping');
      const applied = S.applySplit(tx.id, [{ category: 'Groceries', amount: 50.40 }, { category: 'Shopping', amount: 36 }]);
      t('applySplit accepts a penny-exact split and sets category to the largest part',
        !!applied && applied.category === 'Groceries' && applied.splits.length === 2, JSON.stringify(applied));
      t('applySplit never changes the transaction\'s own total', tx.amount === 86.40);

      const csvRows = S.parseCSV(S.exportCSV());
      const splitRows = csvRows.filter(r => r[2] === 'TARGET SPLIT TEST');
      t('exportCSV expands a split transaction into one row per split, header untouched',
        splitRows.length === 2 && splitRows.every(r => /split \d\/2 of/.test(r[6])), JSON.stringify(splitRows));
      t('exportCSV split rows sum back to the original amount',
        Math.round(splitRows.reduce((s, r) => s + parseFloat(r[3]), 0) * 100) === 8640, JSON.stringify(splitRows));

      t('integrityCheck flags a split that no longer sums to the total', (() => {
        tx.splits[0].amount = 999; // corrupt in place, bypassing applySplit's own validation
        const flagged = S.integrityCheck().some(i => /splits don't add up/.test(i));
        tx.splits[0].amount = 50.40; // restore before clearSplit below
        return flagged;
      })());

      const cleared = S.clearSplit(tx.id);
      t('clearSplit removes the split and leaves amount/category as a normal transaction',
        !!cleared && !cleared.splits && cleared.amount === 86.40);
    })();

    /* categorization pipeline — the confidence tier is what the import review
       triages on, so each rung needs to be the one that answers. */
    const conf = d => S.categorize({ description: d, amount: 0 }).confidence;
    t('learned rule wins outright', conf('GIANT #2 BETHLEHEM PA') === 'rule', conf('GIANT #2 BETHLEHEM PA'));
    t('recurring bill line beats keywords',
      S.categorize({ description: 'NETFLIX.COM', amount: 20 }).confidence === 'bill',
      JSON.stringify(S.categorize({ description: 'NETFLIX.COM', amount: 20 })));
    t('keyword table is the last rung before nothing',
      conf('SHEETZ 455 BETHLEHEM') === 'keyword', conf('SHEETZ 455 BETHLEHEM'));
    t('unknown merchant returns no confidence',
      conf('ZZQX HOLDINGS LLC') === null, String(conf('ZZQX HOLDINGS LLC')));
    t('keyword guess still yields a usable category',
      S.categorize({ description: 'SHEETZ 455 BETHLEHEM', amount: 40 }).category === 'Auto');
    t('guessCategory returns empty, not Other, when nothing matches',
      S.guessCategory('ZZQX HOLDINGS LLC') === '');


    /* recurring-series detector — pinned before priceCreeps/subscriptionNudges
       are rewritten to consume it, so a behavior drift shows up as a failing
       assertion instead of a silent regression. "Today" is whatever the
       system clock reads when this suite runs. */
    (function () {
      const push = (date, desc, amount) => S.data.transactions.push(
        { id: S.uid(), date, category: 'Internet & Streaming', description: desc, amount, who: 'Shared', account: 'Test', notes: '' });
      const today = new Date();
      const iso = d => d.toISOString().slice(0, 10);
      const monthsAgo = n => iso(S.addMonths(today, -n));

      // Stable monthly subscription, last charge recent (~2 weeks ago): 'ok'.
      S.data.transactions = S.data.transactions.filter(t => t.description !== 'STREAMFLIX');
      for (let n = 5; n >= 1; n--) push(monthsAgo(n), 'STREAMFLIX MONTHLY', 15.00);
      const recentIso = (() => { const d = new Date(today); d.setDate(d.getDate() - 14); return iso(d); })();
      push(recentIso, 'STREAMFLIX MONTHLY', 15.00);

      // Price creep: stable at $10, jumped to $13 on the latest charge.
      for (let n = 5; n >= 2; n--) push(monthsAgo(n), 'BOXQUEUE PLUS', 10.00);
      push(monthsAgo(1), 'BOXQUEUE PLUS', 13.00);

      // Doubled: normally monthly, but charged twice within days on the
      // latest cycle.
      const plusDays = (dateIso, n) => { const d = new Date(dateIso + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
      for (let n = 5; n >= 2; n--) push(monthsAgo(n), 'TUNEHUB AUDIO', 9.99);
      push(monthsAgo(1), 'TUNEHUB AUDIO', 9.99);
      push(plusDays(monthsAgo(1), 3), 'TUNEHUB AUDIO', 9.99);

      // Missed: stable monthly, but nothing posted in ~2 cadence lengths.
      for (let n = 6; n >= 2; n--) push(monthsAgo(n), 'GYMFLOW STUDIO', 40.00);

      // Irregular restaurant visits — never a series at all.
      push(monthsAgo(4), 'ROADHOUSE GRILL', 42.10);
      push(monthsAgo(3), 'ROADHOUSE GRILL', 58.20);
      push(monthsAgo(1), 'ROADHOUSE GRILL', 31.00);

      const series = S.recurringSeries();
      const byMerchant = k => series.find(s => s.merchant.toUpperCase().includes(k));

      t('stable monthly subscription reports ok', byMerchant('STREAMFLIX') && byMerchant('STREAMFLIX').status === 'ok',
        JSON.stringify(byMerchant('STREAMFLIX')));
      t('price creep flagged as price-changed', byMerchant('BOXQUEUE') && byMerchant('BOXQUEUE').status === 'price-changed',
        JSON.stringify(byMerchant('BOXQUEUE')));
      t('two close charges flagged as doubled', byMerchant('TUNEHUB') && byMerchant('TUNEHUB').status === 'doubled',
        JSON.stringify(byMerchant('TUNEHUB')));
      t('overdue recurring charge flagged as missed', byMerchant('GYMFLOW') && byMerchant('GYMFLOW').status === 'missed',
        JSON.stringify(byMerchant('GYMFLOW')));
      t('irregular restaurant visits yield no series', !byMerchant('ROADHOUSE'));
      t('recurringSeries ignores merchants with fewer than 3 charges', (() => {
        S.data.transactions.push({ id: S.uid(), date: monthsAgo(1), category: 'Shopping', description: 'ONETIME VENDOR', amount: 20, who: 'Shared', account: '', notes: '' });
        return !S.recurringSeries().find(s => s.merchant.toUpperCase().includes('ONETIME'));
      })());

      // Pinned against the CURRENT (pre-rewrite) priceCreeps/subscriptionNudges
      // so the swap onto recurringSeries() is verified, not assumed. Dates land
      // on the same day-of-month every month so the old calendar-bucket
      // grouping and the new day-delta cadence model agree on this data —
      // deliberately not testing the edge cases where they're allowed to
      // differ (see the comments on the rewritten functions themselves).
      for (let n = 4; n >= 1; n--) push(monthsAgo(n), 'LOOPSTREAM PLUS', 12.00);
      push(monthsAgo(0), 'LOOPSTREAM PLUS', 15.50);
      for (let n = 6; n >= 1; n--) push(monthsAgo(n), 'CLOUDVAULT BACKUP', 8.00);

      const creepsBefore = S.priceCreeps();
      const nudgesBefore = S.subscriptionNudges();
      const loop = creepsBefore.find(c => c.merchant.toUpperCase().includes('LOOPSTREAM'));
      const vault = nudgesBefore.find(n => n.merchant.toUpperCase().includes('CLOUDVAULT'));
      t('priceCreeps catches a stable-then-jumped monthly price', !!loop && near(loop.from, 12.00) && near(loop.to, 15.50),
        JSON.stringify(loop));
      t('subscriptionNudges catches a 6+ month stable subscription', !!vault && vault.months === 6 && near(vault.amount, 8.00),
        JSON.stringify(vault));
    })();


    /* dedupe — the demo seed's dates are relative to today (not fixed like
       Cross-Household-'s real data), so the comparison dates here are built
       relative to the seeded transaction itself rather than hardcoded. */
    const t0 = S.data.transactions[1];
    const near3 = new Date(t0.date + 'T00:00:00'); near3.setDate(near3.getDate() + 2);
    const far17 = new Date(t0.date + 'T00:00:00'); far17.setDate(far17.getDate() + 17);
    t('fuzzy dup within 3 days', !!S.likelyDuplicate({ date: near3.toISOString().slice(0, 10), amount: t0.amount, description: t0.description }));
    t('no dup 17 days out', !S.likelyDuplicate({ date: far17.toISOString().slice(0, 10), amount: t0.amount, description: t0.description }));

    /* debt payoff */
    const acct = { id: 'x', payment: 290, rate: 8 };
    S.data.accounts.push({ id: 'x', name: 'T', kind: 'debt', type: 'Loan', owner: 'Shared', payment: 290, rate: 8 });
    // Snapshot month must be "now" (not a fixed past month) so it's reliably
    // the latest snapshot whenever this file is actually run.
    S.saveSnapshot(S.thisMonth(), { x: 4600 });
    const p0 = S.debtPayoff(acct, 0), p100 = S.debtPayoff(acct, 100);
    t('payoff months sane at 8% APR', p0.months >= 16 && p0.months <= 18, String(p0.months));
    t('extra payment: sooner AND less interest', p100.months < p0.months && p100.interest < p0.interest,
      JSON.stringify([p0, p100]));
    t('payment below interest flagged', S.debtPayoff({ id: 'x', payment: 10, rate: 8 }, 0).months === null);

    /* forecast ripple */
    const base = S.forecast(12);
    S.data.planned.push({ id: 'pl1', name: 'test', month: base.months[3].ym, amount: 500 });
    const after = S.forecast(12);
    t('planned one-off ripples to the end', near(base.months[11].balance - after.months[11].balance, 500),
      String(base.months[11].balance - after.months[11].balance));

    /* estimatedBalance — Zero-Entry Net Worth. Dates are relative to the
       actual run date, not hardcoded, so the suite stays valid regardless of
       when it runs. */
    (function () {
      const iso = d => d.toISOString().slice(0, 10);
      const monthsAgoYm = n => iso(S.addMonths(new Date(), -n)).slice(0, 7);

      // Debt: verified against the amortization formula directly, not
      // against debtPayoff() — that answers a different question
      // (months-from-now-to-zero), not "what happened since a dated snapshot".
      const debtAcct = { id: 'est-debt', name: 'Test Loan', kind: 'debt', type: 'Loan', owner: 'Shared', payment: 300, rate: 6 };
      S.data.accounts.push(debtAcct);
      const twoMonthsAgo = monthsAgoYm(2);
      S.saveSnapshot(twoMonthsAgo, { [debtAcct.id]: 3000 });
      const di = 0.06 / 12;
      let expectDebt = 3000;
      for (let k = 0; k < 2; k++) expectDebt = expectDebt * (1 + di) - 300;
      const estDebt = S.estimatedBalance(debtAcct.id);
      t('estimatedBalance amortizes a debt forward from its last snapshot',
        !!estDebt && near(estDebt.balance, expectDebt, 0.5), JSON.stringify([estDebt, expectDebt]));

      const oneMonthAgo = monthsAgoYm(1);
      // The demo seed pre-populates a this-month snapshot for every account
      // (so Net Worth and Forecast have something to show on first open) —
      // clear it for the accounts under test so "one month stale" is
      // actually what gets exercised, matching a real household that hasn't
      // snapshotted yet this month.
      const clearThisMonth = id => { if (S.data.snapshots[S.thisMonth()]) delete S.data.snapshots[S.thisMonth()][id]; };

      // Savings (the HYSA-type account): verified against the same
      // deposit + APY formula the function documents using.
      const savingsAcct = S.data.accounts.find(a => a.name === 'High-Yield Savings');
      clearThisMonth(savingsAcct.id);
      S.saveSnapshot(oneMonthAgo, { [savingsAcct.id]: 1000 });
      const apy = S.data.invest.hysa.apys[1];
      const expectSavings = 1000 * (1 + apy / 100 / 12) + (+S.data.invest.hysa.deposit || 0);
      const estSavings = S.estimatedBalance(savingsAcct.id);
      t('estimatedBalance rolls the HYSA forward by modeled deposit + base APY',
        !!estSavings && near(estSavings.balance, expectSavings, 0.5), JSON.stringify([estSavings, expectSavings]));

      // Checking: the whole point of factoring liquidCashFlow() out of
      // forecast() — this cross-checks that estimatedBalance's Checking
      // branch and forecast()'s own first month agree on the same delta,
      // rather than two copies of the same formula that could drift apart.
      const checkingAcct = S.data.accounts.find(a => a.name === 'Joint Checking');
      clearThisMonth(checkingAcct.id);
      S.saveSnapshot(oneMonthAgo, { [checkingAcct.id]: 5000 });
      const fc1 = S.forecast(1);
      const estChecking = S.estimatedBalance(checkingAcct.id);
      t('estimatedBalance\'s Checking roll-forward agrees with forecast()\'s own delta',
        !!estChecking && near(estChecking.balance, 5000 + fc1.months[0].delta, 0.01),
        JSON.stringify([estChecking, fc1.months[0]]));

      const freshDebt = { id: 'est-debt-fresh', name: 'Fresh Loan', kind: 'debt', type: 'Loan', owner: 'Shared', payment: 100, rate: 5 };
      S.data.accounts.push(freshDebt);
      t('estimatedBalance returns null with no prior snapshot', S.estimatedBalance(freshDebt.id) === null);

      const rothAcct2 = S.data.accounts.find(a => a.type === 'Investment');
      t('estimatedBalance never guesses an Investment account — market performance isn\'t derivable from a deposit amount',
        S.estimatedBalance(rothAcct2.id) === null);
    })();

    /* CSV round trip */
    const csv = S.exportCSV();
    const rows = S.parseCSV(csv);
    t('CSV header exact workbook order', rows[0].join(',') === S.CSV_HEADER.join(','), rows[0].join(','));
    t('CSV row count = transactions', rows.length - 1 === S.data.transactions.length);
    t('csvEscape quotes commas and quotes', S.csvEscape('a,"b"') === '"a,""b"""', S.csvEscape('a,"b"'));

    /* pay cycles — picked dynamically from the household's actual roster
       instead of hardcoded names, since membership here isn't fixed to two
       people named Mike and Bri. */
    const [person1, person2] = S.members();
    S.data.payCycles = {
      [person1]: { frequency: 'biweekly', anchor: '2026-06-19' },
      [person2]: { frequency: 'semimonthly', anchor: '2026-07-01' }
    };
    const person1Paydays = S.paydaysInMonth(person1, '2026-07');
    t('biweekly paydays land 14 days apart', person1Paydays.length === 3
      && person1Paydays[0] === '2026-07-03' && person1Paydays[1] === '2026-07-17' && person1Paydays[2] === '2026-07-31',
      JSON.stringify(person1Paydays));
    const person2Paydays = S.paydaysInMonth(person2, '2026-07');
    t('semimonthly paydays are the 1st and 16th', person2Paydays.length === 2
      && person2Paydays[0] === '2026-07-01' && person2Paydays[1] === '2026-07-16', JSON.stringify(person2Paydays));
    t('unset pay cycle yields no paydays', S.paydaysInMonth('nobody', '2026-07').length === 0);
    t('a month entirely before the anchor has no paydays', S.paydaysInMonth(person1, '2026-05').length === 0);
    const rentBill = S.data.budget.find(b => b.name === 'Rent');
    rentBill.dueDay = 2;
    const fp = S.fundingPaycheck(rentBill, '2026-07');
    t('a Shared bill is funded by the closest paycheck on/before its due date, not one after',
      !!fp && fp.date <= '2026-07-02' && fp.date === '2026-07-01' && fp.person === person2, JSON.stringify(fp));
    const allocations = S.paycheckAllocations('2026-07');
    t('paycheck allocations sum to the funded bills\' total',
      near(allocations.reduce((s, a) => s + a.amount, 0),
        S.data.budget.filter(b => b.type === 'Fixed' && b.dueDay).reduce((s, b) => s + b.monthly, 0)),
      JSON.stringify(allocations));

    /* household snapshot selector (Dashboard / Summary / Report read from one source) */
    const snap = S.householdSnapshot(S.thisMonth());
    const sumNow = S.monthSummary(S.thisMonth());
    t('snapshot.summary matches monthSummary', near(snap.summary.spent, sumNow.spent) && near(snap.summary.budget, sumNow.budget), JSON.stringify(snap.summary));
    t('snapshot surplus & savingsRate match Store', near(snap.surplus, S.surplus()) && near(snap.savingsRate, S.savingsRate()));
    t('snapshot.netWorth.latest is the last series point', (() => {
      const nw = S.netWorthSeries();
      const last = nw.length ? nw[nw.length - 1] : null;
      if (!snap.netWorth.latest || !last) return snap.netWorth.latest === last;
      return near(snap.netWorth.latest.net, last.net) && snap.netWorth.latest.ym === last.ym;
    })());
    t('snapshot.debt.total sums debt balances', near(snap.debt.total,
      S.data.accounts.filter(a => a.kind === 'debt').reduce((s, a) => s + (S.latestBalance(a.id) || 0), 0)));
    t('snapshot.insights (lazy) equals insights()', snap.insights.length === S.insights().length);

    // Note: Cross-Household-'s harness also checks integrityCheck() (seed
    // passes, bad rows get caught) — that function doesn't exist in this
    // repo yet (a separate, older hardening gap, not part of this port), so
    // those two assertions aren't included here.

    document.getElementById('summary').innerHTML = fail
      ? '<span class="fail">' + fail + ' failed</span> · ' + pass + ' passed'
      : '<span class="pass">All ' + pass + ' tests passed</span>';
    } catch (e) {
      document.getElementById('summary').innerHTML = '<span class="fail">Test run crashed: ' + e.message + '</span>';
    } finally {
      // ALWAYS restore the user's real data, even if a test throws
      if (window.__realData) localStorage.setItem('householdFinance.v1', window.__realData);
      else localStorage.removeItem('householdFinance.v1');
    }
  </script>
</body>
</html>
